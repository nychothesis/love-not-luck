<!DOCTYPE html>
<html lang="id">
<head>

<title>Cek email lu</title>
<link rel="preload" as="font" type="font/woff2" href="assets/fonts/inter-900.woff2" crossorigin>

<body>
<div class="aura" aria-hidden="true"><i class="a1"></i><i class="a2"></i></div>

    <img src="assets/logo.svg" alt="" width="34" height="34">
    <div class="brand-name">NYCHO<span>THESIS</span></div>
  </div>

  <span class="eyebrow">Love, Not Luck</span>
  <h1>Lu udah <em>terdaftar</em>.</h1>

    Ebook-nya gw kirim ke email lu. Kalau belum keliatan, cek juga folder

  </p>

  <!-- Panel grup WA baru muncul kalau WA_LINK di bawah udah diisi. -->
  <div class="panel" id="wa-panel" hidden>
    <p class="lead"><b>Satu langkah lagi:</b></p>
    <p class="sub wa-copy">Masuk grup WA Love, Not Luck. Info rilis ebook dan update berikutnya gw kabarin di sana duluan.</p>
    <a class="btn-primary" id="wa-btn" href="#" rel="noopener">Masuk grup WA</a>
  </div>
</div>
<script>
  // TODO: isi link undangan grup WA Love, Not Luck. Selama kosong, panelnya disembunyiin.
  var WA_LINK = '';
  if (WA_LINK) {
    document.getElementById('wa-btn').href = WA_LINK;
    document.getElementById('wa-panel').hidden = false;
  }
</script>
