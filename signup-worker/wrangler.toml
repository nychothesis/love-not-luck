name = "nychothesis-lm-signup"
main = "worker.mjs"
compatibility_date = "2026-10-15"
compatibility_flags = ["nodejs_compat"]

[vars]
EMAILOCTOPUS_LIST_ID = "59e20f62-c87d-11f1-8a9e-752b79b9034a"
# Tag batch webinar buat signup baru. Ganti ke batch berikutnya (webinar-b3, dst.) abis tiap webinar, lalu `npx wrangler deploy`.
WEBINAR_BATCH = "webinar-b2"
# Tag topik batch ini. Produk 1: topik-hindari-cowo. Ganti kalo batch berikutnya bahas produk lain (mis. topik-cowo-betah), bareng WEBINAR_BATCH.
WEBINAR_TOPIC = "topik-hindari-cowo"
